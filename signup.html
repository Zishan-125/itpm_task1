<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'none';">
    <title>Sign Up - ITPM</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="auth-container">
        <h1>Sign Up</h1>
        <form action="success_signup.html" method="GET">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create password" required>
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" placeholder="Repeat password" required>
            </div>

            <div class="btn-group">
                <button type="submit">Register</button>
            </div>
        </form>

        <hr>
        <div class="footer-link">
            Already have an account? <a href="signin.html">Sign In here</a>
        </div>
    </div>

</body>
</html>
