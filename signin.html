<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'none';">
    <title>Sign In - ITPM</title>
    <link rel="stylesheet" href="index.css">
    <style>
        /* This hides the success message by default */
        .success-overlay {
            display: none;
        }

        /* Pure CSS Logic: If the form is valid AND the user clicks the button,
           we use the "target" or "active" state to show the message. 
           For a truly no-JS solution, we use a separate success page as follows: */
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>Sign In</h1>
        <form action="success_signin.html" method="GET">
        <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="••••••••" required>
        </div>

        <div class="btn-group">
            <button type="submit">Login</button>
        </div>
    </form>

        <hr>
        <div class="footer-link">
            New user? <a href="signup.html">Create an account</a>
        </div>
    </div>

</body>
</html>
